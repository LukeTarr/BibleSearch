{{define "header"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BibleSearch.ing</title>
  <meta name="description" content="Search the King James Bible by meaning: describe a verse the way you remember it." />
  <meta name="author" content="Luke Tarr" />
  <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1c1719" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/assets/ico.png" />
  <link rel="preload" href="/assets/fonts/eb-garamond-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/assets/app.css" />
  <!-- Cross-fade between pages, and swap error responses in so search errors show up in the page -->
  <meta name="htmx-config" content='{"globalViewTransitions": true, "responseHandling": [{"code": "204", "swap": false}, {"code": "[2345]..", "swap": true}]}' />
  <script src="/assets/htmx.min.js"></script>
</head>
<body hx-boost="true" class="min-h-dvh flex flex-col">
  <header class="w-full max-w-3xl mx-auto px-6 pt-6 sm:pt-8 flex items-center justify-between gap-4">
    <a href="/" class="flex items-center gap-3 group">
      <img src="/assets/ico.png" alt="" class="size-7 sm:size-8 transition-transform duration-500 group-hover:-rotate-6" />
      <span class="text-xl sm:text-2xl tracking-tight">Bible<span class="italic text-plum">Search</span><span class="text-ink-soft">.ing</span></span>
    </a>
    <nav class="flex items-center gap-4 sm:gap-6 sm:text-lg">
      <a href="/" class="hidden xs:inline text-ink-soft hover:text-plum transition-colors">Home</a>
      <a href="/about" class="text-ink-soft hover:text-plum transition-colors">About</a>
      <a href="/swagger/" hx-boost="false" class="text-ink-soft hover:text-plum transition-colors">API</a>
    </nav>
  </header>
  <main class="flex-1 w-full max-w-2xl mx-auto px-6">
{{end}}
