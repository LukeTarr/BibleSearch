{{define "results"}}
<div id="searchResultArea" class="w-full">
  {{range .}}
  <div class="flex items-center justify-center flex-row m-4">
    <a href="{{.Metadata.ReferenceLink}}" target="_blank" rel="noopener noreferrer"
      class="block max-w-xl p-6 bg-white border border-gray-200 rounded-lg shadow-sm hover:bg-gray-100 dark:bg-gray-800 dark:border-gray-700 dark:hover:bg-gray-700">
      <h5 class="mb-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-white">{{.Text}}</h5>
      <p class="font-normal text-gray-700 dark:text-gray-400">{{.Metadata.Book}} {{.Metadata.Chapter}}:{{.Metadata.Verse}}</p>
    </a>
  </div>
  {{end}}
</div>
{{end}}
