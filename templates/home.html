{{define "home"}}
{{template "header"}}
    <section class="pt-16 sm:pt-24 text-center">
      <h1 class="text-5xl sm:text-6xl font-medium tracking-tight leading-[1.05]">
        Seek, and ye shall <span class="italic text-plum">find.</span>
      </h1>
      <p class="mt-3 text-sm uppercase tracking-[0.2em] text-ink-soft" style="font-feature-settings: 'lnum'">Matthew 7:7</p>
      <p class="mt-8 text-xl leading-relaxed text-ink-soft text-balance">
        Describe a verse the way you remember it, and find it by its meaning rather than its exact words.
      </p>
    </section>

    <form class="mt-10" hx-post="/search" hx-target="#searchResultArea" hx-swap="outerHTML">
      <label for="query" class="sr-only">Describe the verse you're looking for</label>
      <div class="relative">
        <input type="search" id="query" name="query" maxlength="500" required autocomplete="off"
          placeholder="the lilies of the field…"
          class="w-full rounded-full bg-paper-deep/70 border border-rule pl-7 pr-16 py-4 text-xl text-ink placeholder:italic placeholder:text-ink-soft/70 shadow-[inset_0_1px_3px_rgb(0_0_0/0.06)] transition focus:outline-none focus:border-plum/60 focus:bg-paper focus:ring-4 focus:ring-plum/10 [&::-webkit-search-cancel-button]:hidden" />
        <button type="submit" aria-label="Search"
          class="absolute right-2 top-1/2 -translate-y-1/2 size-12 rounded-full bg-plum text-paper grid place-items-center transition hover:scale-105 active:scale-95">
          <svg viewBox="0 0 24 24" class="search-arrow col-start-1 row-start-1 size-5 transition-opacity" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
          <svg viewBox="0 0 24 24" class="search-spinner col-start-1 row-start-1 size-5 transition-opacity" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="M12 3a9 9 0 1 1-9 9" />
          </svg>
        </button>
      </div>
      <p class="mt-5 text-center text-ink-soft" onclick="const b = event.target.closest('[data-q]'); if (b) { const i = document.getElementById('query'); i.value = b.dataset.q; i.form.requestSubmit() }">
        <span class="italic">Or try</span>
        <button type="button" data-q="the Lord is my shepherd" class="suggestion">the Lord is my shepherd</button>
        <span class="text-gold" aria-hidden="true">&middot;</span>
        <button type="button" data-q="don't worry about tomorrow" class="suggestion">don't worry about tomorrow</button>
        <span class="text-gold" aria-hidden="true">&middot;</span>
        <button type="button" data-q="Eve eats the apple" class="suggestion">Eve eats the apple</button>
      </p>
    </form>

    {{template "results" .}}
{{template "footer"}}
{{end}}
