version: '3.9'

networks:
  net:
    driver: bridge
services:
  server:
    # Pinned: the app talks to Chroma's v2 REST API directly (services/chromaclient.go)
    image: ghcr.io/chroma-core/chroma:1.5.9
    environment:
      - CHROMA_ALLOW_RESET=true
    volumes:
      - chroma-data:/data
    ports:
      - "8000:8000"
    networks:
      - net

volumes:
  chroma-data:
    driver: local
